<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainKB Assistant - Basic Usage</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // This would be imported from the npm package
        // import { BrainKBChatWidget } from 'brainkb-assistant';
        
        // For demo purposes, we'll simulate the component
        const BrainKBChatWidget = ({ config = {} }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                {
                    id: '1',
                    type: 'assistant',
                    content: "Hello and welcome to BrainKB Assistant! 👋",
                    timestamp: new Date(),
                    sender: config.branding?.title || 'BrainKB Assistant'
                }
            ]);
            const [inputValue, setInputValue] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            const handleSendMessage = async () => {
                if (!inputValue.trim()) return;

                const userMessage = {
                    id: Date.now().toString(),
                    type: 'user',
                    content: inputValue,
                    timestamp: new Date(),
                    sender: 'You'
                };

                setMessages(prev => [...prev, userMessage]);
                setInputValue('');
                setIsLoading(true);

                // Simulate API call
                setTimeout(() => {
                    const response = {
                        id: (Date.now() + 1).toString(),
                        type: 'assistant',
                        content: `I received your message: "${inputValue}". This is a demo response.`,
                        timestamp: new Date(),
                        sender: config.branding?.title || 'BrainKB Assistant'
                    };
                    setMessages(prev => [...prev, response]);
                    setIsLoading(false);
                }, 1000);
            };

            return React.createElement('div', null,
                // Floating button
                React.createElement('div', {
                    className: 'fixed bottom-6 right-6 z-50'
                },
                    React.createElement('button', {
                        onClick: () => setIsOpen(!isOpen),
                        className: 'bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-110'
                    },
                        isOpen ? '✕' : '💬'
                    )
                ),

                // Chat widget
                isOpen && React.createElement('div', {
                    className: 'fixed bottom-24 right-6 w-96 h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-200 z-50 flex flex-col'
                },
                    // Header
                    React.createElement('div', {
                        className: 'bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-t-2xl'
                    },
                        React.createElement('div', {
                            className: 'flex items-center justify-between'
                        },
                            React.createElement('div', {
                                className: 'flex items-center space-x-3'
                            },
                                React.createElement('div', {
                                    className: 'text-2xl'
                                }, '🧠'),
                                React.createElement('div', null,
                                    React.createElement('h3', {
                                        className: 'font-semibold'
                                    }, config.branding?.title || 'BrainKB Assistant'),
                                    React.createElement('p', {
                                        className: 'text-xs text-blue-100'
                                    }, config.branding?.subtitle || 'Knowledge Base Helper')
                                )
                            ),
                            React.createElement('button', {
                                onClick: () => setIsOpen(false),
                                className: 'text-white hover:text-gray-200 transition-colors'
                            }, '✕')
                        )
                    ),

                    // Messages
                    React.createElement('div', {
                        className: 'flex-1 overflow-auto p-4 space-y-3'
                    },
                        messages.map(message => 
                            React.createElement('div', {
                                key: message.id,
                                className: `flex ${message.type === 'user' ? 'justify-end' : 'justify-start'}`
                            },
                                React.createElement('div', {
                                    className: `max-w-xs ${message.type === 'user' ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white' : 'bg-gray-100 text-gray-800'} rounded-lg p-3 text-sm shadow-sm`
                                },
                                    React.createElement('p', null, message.content)
                                )
                            )
                        ),
                        isLoading && React.createElement('div', {
                            className: 'flex justify-start'
                        },
                            React.createElement('div', {
                                className: 'bg-gray-100 rounded-lg p-3'
                            },
                                React.createElement('div', {
                                    className: 'flex items-center space-x-2'
                                },
                                    React.createElement('div', {
                                        className: 'animate-spin rounded-full h-3 w-3 border-b-2 border-blue-600'
                                    }),
                                    React.createElement('span', {
                                        className: 'text-xs text-gray-600'
                                    }, 'Typing...')
                                )
                            )
                        )
                    ),

                    // Input
                    React.createElement('div', {
                        className: 'p-4 border-t border-gray-200 bg-gray-50 rounded-b-2xl'
                    },
                        React.createElement('div', {
                            className: 'flex items-center space-x-2'
                        },
                            React.createElement('input', {
                                type: 'text',
                                value: inputValue,
                                onChange: (e) => setInputValue(e.target.value),
                                onKeyPress: (e) => e.key === 'Enter' && handleSendMessage(),
                                placeholder: 'Ask about evidence, genome data, anatomical structures...',
                                className: 'flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent'
                            }),
                            React.createElement('button', {
                                onClick: handleSendMessage,
                                disabled: !inputValue.trim() || isLoading,
                                className: 'px-3 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg hover:from-blue-700 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all'
                            }, 'Send')
                        )
                    )
                )
            );
        };

        // Main App Component
        const App = () => {
            const config = {
                branding: {
                    title: 'BrainKB Assistant',
                    subtitle: 'Knowledge Base Helper'
                },
                theme: {
                    primaryColor: 'from-blue-600 to-purple-600',
                    secondaryColor: 'from-blue-700 to-purple-700'
                }
            };

            return React.createElement('div', {
                className: 'min-h-screen bg-gradient-to-br from-blue-50 to-purple-50'
            },
                React.createElement('div', {
                    className: 'container mx-auto px-4 py-8'
                },
                    React.createElement('h1', {
                        className: 'text-4xl font-bold text-center text-gray-800 mb-8'
                    }, 'BrainKB Assistant Demo'),
                    React.createElement('p', {
                        className: 'text-center text-gray-600 mb-8 max-w-2xl mx-auto'
                    }, 'This is a demonstration of the BrainKB Assistant widget. Click the chat button in the bottom-right corner to start a conversation.'),
                    React.createElement('div', {
                        className: 'bg-white rounded-lg shadow-lg p-6 max-w-4xl mx-auto'
                    },
                        React.createElement('h2', {
                            className: 'text-2xl font-semibold mb-4'
                        }, 'Features'),
                        React.createElement('ul', {
                            className: 'space-y-2 text-gray-700'
                        },
                            React.createElement('li', null, '✅ Floating chat widget'),
                            React.createElement('li', null, '✅ Customizable branding and themes'),
                            React.createElement('✅ Backend API integration ready'),
                            React.createElement('li', null, '✅ Responsive design'),
                            React.createElement('li', null, '✅ BrainKB knowledge base focused'),
                            React.createElement('li', null, '✅ Lightweight and fast')
                        )
                    )
                ),
                React.createElement(BrainKBChatWidget, { config })
            );
        };

        // Render the app
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
